# Proves the starter itself works: its example tests pass against the demo application,
# and a project made from it passes the gate.
name: Starter self-test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: starter-self-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: cp .env.example .env
      - run: npm test
      - name: The same tests, signing in per worker and calling the API with a token
        run: |
          jq '. + {signInPerWorker: true, apiAuth: "bearer"}' config/environments/local.json \
            > config/environments/local-token.json
          sed -n 's/^LOCAL_/LOCAL_TOKEN_/p' .env.example >> .env
          node demo-app/server.mjs &
          until curl -sf http://localhost:3210/health > /dev/null; do sleep 1; done
          TEST_ENV=local-token npm test
      - name: Keep the report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  new-project:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: A project made from the starter passes the gate
        run: |
          node scripts/init-project.mjs --name "Sample Project" \
            --env staging=https://staging.example.test --env prod=https://app.example.test \
            --roles user,admin
          npm run check
